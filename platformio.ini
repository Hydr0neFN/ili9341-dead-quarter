; ILI9341 / ILI9341_2 panel-init demo for NodeMCU v3 (ESP8266)
;
; Two environments, IDENTICAL source. Only the driver variant differs.
;   nodemcu_wrong -> ILI9341_DRIVER    (stock register set)  -> broken panel
;   nodemcu_right -> ILI9341_2_DRIVER  (clone register set)  -> correct panel
;
;   pio run -e nodemcu_wrong -t upload && pio device monitor
;   pio run -e nodemcu_right -t upload && pio device monitor
;
; See README.md for the wiring table and the explanation.

[common]
platform  = espressif8266
board     = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps  = bodmer/TFT_eSPI@^2.5.43

; --- shared TFT_eSPI configuration -------------------------------------
; Everything TFT_eSPI needs is defined here, so User_Setup.h inside the
; library is never touched and never edited by hand.
build_flags =
  -D USER_SETUP_LOADED=1

  ; panel geometry: the module's native orientation is portrait 240x320
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320

  ; NodeMCU v3 pin map -- see README wiring table
  -D TFT_MOSI=13   ; D7  (HSPI MOSI, fixed)
  -D TFT_SCLK=14   ; D5  (HSPI SCLK, fixed)
  -D TFT_MISO=12   ; D6  (HSPI MISO, fixed) -- SDO, optional
  -D TFT_CS=5      ; D1
  -D TFT_DC=4      ; D2
  -D TFT_RST=2     ; D4  (has an onboard pull-up, so it idles HIGH at boot)

  ; fonts used by the demo
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_GFXFF=1

  ; 40 MHz is the practical ceiling on ESP8266's HSPI.
  ; Drop to 27000000 first if you see sparkle/noise on long jumper wires.
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000

; -----------------------------------------------------------------------
; WRONG on purpose: stock ILI9341 register set.
; On a clone panel this leaves the last quarter of the screen uninitialised.
[env:nodemcu_wrong]
extends = common
build_flags =
  ${common.build_flags}
  -D ILI9341_DRIVER=1

; -----------------------------------------------------------------------
; CORRECT for these cheap clone panels (and for the CYD, ESP32-2432S028).
[env:nodemcu_right]
extends = common
build_flags =
  ${common.build_flags}
  -D ILI9341_2_DRIVER=1
  ; If whites come out black / greens come out purple, add:
  ; -D TFT_INVERSION_ON=1
